server {
  listen 3000;
  root /usr/share/nginx/html;

  # Proxy do gatewaya (serwis "backend" z docker-compose.yml)
  location /v1/ { proxy_pass http://backend:8000; }
  location /api/ { proxy_pass http://backend:8000; }

  # SPA fallback dla react-router
  location / { try_files $uri /index.html; }
}
