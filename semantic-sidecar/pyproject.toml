[project]
name = "semantic-sidecar"
version = "0.0.1"
description = "Sidecar semantyczny AI Control Layer: detektory zwracają sygnały ryzyka, decyzję podejmuje gateway."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
eval = [
    "httpx>=0.27",
    "datasets>=2.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
