# Konfiguracja z modelami AI (testy i ewaluacja). Użycie:
#   SEMANTIC_CONFIG=config/semantic.models.yaml uvicorn app.main:app --port 8001
#   python -m evaluation.run --inprocess --config config/semantic.models.yaml
# Wymaga pobranych modeli: python -m scripts.fetch_models. Domyślny config/semantic.yaml nie ładuje modeli.
# Modele są wymienne: zmiana `model_dir` i `positive_label` wystarcza, bez zmian w kodzie.

input:
  # false = sidecar normalizuje sam (warianty: odkodowane, leet, litery rozstrzelone, od tyłu, wielkość liter, homoglify).
  # Gateway (Java) normalizacji jeszcze nie robi, więc dziś musi robić to sidecar: pomiar na puli testów pokazał leet 29% -> 86%,
  # tekst od tyłu 24% -> 81%, rozstrzelone litery 5% -> 95%. Gdy Java zacznie normalizować, ustaw true (kontrakt: docs/input-contract.md).
  pre_normalized: false

limits:
  max_input_chars: 20000

deadlines:
  request_deadline_ms: 20000     # długie instrukcje i historia klientów agentowych na CPU
  detector_timeout_ms: 15000
  normalization_timeout_ms: 500
  max_workers: 8

evidence:
  include_preview: false
  digest_key_env: SEMANTIC_EVIDENCE_KEY

detectors:
  # Zespół dwóch klasyfikatorów injection (Horizon small + base): średnia marginesów logitów, jedna wspólna kalibracja.
  injection_classifier_ensemble:
    kind: hf_ensemble
    enabled: true
    params:
      calibration: config/calibration/injection_classifier_ensemble.json   # scripts/calibrate.py --fit heldout
      label: injection
      checkpoints: [P1, P2, P5]
      time_budget_ms: 1200    # wspólny budżet czasu obu modeli i wszystkich wariantów tekstu; po nim `coverage` < 1 zamiast timeoutu
      members:
        - model_dir: models/injection_classifier_horizon        # Horizon small (141M)
          positive_label: INJECTION
          max_length: 512         # okna 512 są ok. 5x tańsze na token niż 2048 (zmierzone)
          max_windows: 24         # było 8: atak w środku tekstu 20000 znaków był wykrywany w 17% przypadków, teraz w 96%
          window_batch: 4         # okien na wywołanie modelu; budżet sprawdzamy po każdej porcji
        - model_dir: models/injection_classifier_horizon_base   # Horizon base (308M)
          positive_label: INJECTION
          max_length: 512
          max_windows: 24
          window_batch: 4
