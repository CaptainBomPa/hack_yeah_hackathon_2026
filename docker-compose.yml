# docker-compose dla hackathonu — docelowo wdrażany w całości na Raspberry Pi (backend razem
# z Ollamą w jednej sieci docker, VISION.md §2). db + backend + ollama działają (backend
# w profilu prod). Frontend nie ma jeszcze Dockerfile'a, sidecar semantyczny jeszcze nie istnieje.
# Katalog dozwolonych modeli (allowlista) żyje w backend/src/main/resources/application.yml
# (`control-layer.models`) — modele pulluje `ollama-init` poniżej; muszą się zgadzać.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackyeah
      POSTGRES_PASSWORD: hackyeah
      POSTGRES_DB: hackyeah
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackyeah -d hackyeah"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hackyeah
      SPRING_DATASOURCE_USERNAME: hackyeah
      SPRING_DATASOURCE_PASSWORD: hackyeah
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    # Musi pullować dokładnie te tagi, które są w allowliście (control-layer.models).
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:1.5b-instruct-q4_K_M && ollama pull qwen2.5:0.5b"]

volumes:
  db_data:
  ollama_data:
