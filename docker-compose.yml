# docker-compose dla hackathonu — docelowo wdrażany w całości na Raspberry Pi (backend razem
# z Ollamą w jednej sieci docker, VISION.md §2). db + backend + ollama + sidecar semantyczny działają
# (backend w profilu prod). Frontend nie ma jeszcze Dockerfile'a.
# Katalog dozwolonych modeli (allowlista) żyje w backend/src/main/resources/application.yml
# (`control-layer.models`) — modele pulluje `ollama-init` poniżej; muszą się zgadzać.
# Sidecar semantyczny (semantic-sidecar/) jest opcjonalnym providerem analizy semantycznej (VISION.md §2).
# Backend woła go z guarda SEM-001 (SIDECAR_BASE_URL=http://semantic-sidecar:8001, SEMANTIC_GUARD_ENABLED).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackyeah
      POSTGRES_PASSWORD: hackyeah
      POSTGRES_DB: hackyeah
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackyeah -d hackyeah"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hackyeah
      SPRING_DATASOURCE_USERNAME: hackyeah
      SPRING_DATASOURCE_PASSWORD: hackyeah
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Kontrola semantyczna (guard SEM-001) przez sidecar. Fail-closed: bez zdrowego sidecara backend blokuje żądania.
      SIDECAR_BASE_URL: http://semantic-sidecar:8001
      SEMANTIC_GUARD_ENABLED: ${SEMANTIC_GUARD_ENABLED:-true}
      # Klucz łańcucha HMAC audytu (docs/deterministic/27-audit-logging.md); w prod ustawić własny.
      CONTROL_LAYER_AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:-change-me-audit-chain-key}
    ports:
      - "8000:8000"
    volumes:
      # Polityka (config/policy.yaml) z hosta: bez niej backend odmawia każdego modelu, a jury
      # może ją edytować bez przebudowy obrazu. users.yaml w profilu prod jest ignorowany.
      - ./backend/config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      semantic-sidecar:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    # Musi pullować dokładnie te tagi, które są w allowliście (control-layer.models).
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:1.5b-instruct-q4_K_M && ollama pull qwen2.5:0.5b"]

  # Sidecar semantyczny (semantic-sidecar/README.md). Wagi modeli pobiera semantic-sidecar-init do wolumenu
  # sidecar_models. Pierwszy start wymaga internetu (Hugging Face); kolejne działają offline.
  semantic-sidecar-init:
    build:
      context: ./semantic-sidecar
    restart: "no"
    command: ["python", "-m", "scripts.fetch_models", "--if-missing", "--only", "injection_classifier_horizon"]
    volumes:
      - sidecar_models:/app/models

  semantic-sidecar:
    build:
      context: ./semantic-sidecar
    restart: unless-stopped
    environment:
      # Klucz HMAC skrótów dowodów (bez niego skróty są losowe i zmieniają się po restarcie); w prod ustawić własny.
      SEMANTIC_EVIDENCE_KEY: ${SEMANTIC_EVIDENCE_KEY:-change-me-evidence-key}
      # Liczba wątków PyTorcha. Na Raspberry Pi współdzielonym z Ollamą warto ograniczyć.
      OMP_NUM_THREADS: ${SIDECAR_THREADS:-4}
    ports:
      - "8001:8001"
    volumes:
      # Konfiguracja i kalibracja z hosta (jak backend/config): jury może zmieniać progi bez przebudowy obrazu.
      # Zmiana wymaga restartu sidecara (hot-reload jeszcze nie istnieje).
      - ./semantic-sidecar/config:/app/config:ro
      - sidecar_models:/app/models
    depends_on:
      semantic-sidecar-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  db_data:
  ollama_data:
  sidecar_models:
