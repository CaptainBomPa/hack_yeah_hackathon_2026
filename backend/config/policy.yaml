# Polityka uprawnień gatewaya (CRITERIA §4.1: jedna konfiguracja; docs/auth/).
# Klucz pod `roles` to rola konta z `app_user.role` (chat | admin | agent).
# `models` to tagi z katalogu `control-layer.models` w application.yml; `"*"` = wszystkie.
# Rola bez wpisu albo model spoza listy = odmowa (403, blockedBy policy.model-access).
# `budget.dailyTokens` to dzienny limit tokenów tej roli (docs/deterministic/14-token-budget-quotas.md,
# BUDGET-003); brak sekcji `budget` = bez limitu (np. admin). Wyczerpanie = 429, blockedBy budget.daily_cap.
# Wczytywane przy starcie; hot reload pojawi się w kolejnym kroku.
policy:
  # Defaults also apply when this section or a role override is missing. Explicit off required to disable.
  rateLimit:
    mode: block
    requestsPerMinute: 30
    burstCapacity: 5
    maxConcurrentPerUser: 2
    maxConcurrentGlobal: 8
    pipelineTimeout: 120s
  roles:
    admin:
      models: ["*"]
    agent:
      models: ["qwen2.5:1.5b-instruct-q4_K_M"]
      budget:
        dailyTokens: 100000
    chat:
      models: ["qwen2.5:1.5b-instruct-q4_K_M", "qwen2.5:0.5b"]
      budget:
        dailyTokens: 20000
      # rateLimit:
      #   mode: block
