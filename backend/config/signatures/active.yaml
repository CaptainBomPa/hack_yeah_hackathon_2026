# Aktywny feed sygnatur historycznych ataków — czyta go guard SIG-FEED (hot reload, bez restartu).
# Format i zasady: docs/redteam-feed.md. Każda sygnatura MUSI mieć tests.positive i tests.negative;
# po każdej zmianie uruchom regresję z katalogu backend/:  ./gradlew signatureRegression
# Wpisy SIG-PKG-* pochodzą z ./gradlew threatFeed (OSV.dev), zaakceptowane 2026-10-04.
feed_version: "2026-10-04.1"
signatures:
  - id: SIG-PKG-NPM-MCP-REMOTE
    title: "Vulnerable npm:mcp-remote (1 advisories in OSV)"
    class: vulnerable-component
    refs: ["GHSA-6xpm-ggf7-wc3p", "CVE-2025-6514"]
    action: block   # co najmniej jedno advisory HIGH/CRITICAL
    match:
      type: package-version
      names: ["mcp-remote"]
      ranges:
        - [{introduced: "0.0.5"}, {fixed: "0.1.16"}]   # GHSA-6xpm-ggf7-wc3p
    tests:
      positive: ["npx mcp-remote@0.0.5", '{"serverInfo":{"name":"mcp-remote","version":"0.1.15"}}']
      negative: ["npx mcp-remote@0.1.16"]
  - id: SIG-PKG-NPM-MODELCONTEXTPROTOCOL-INSPECTOR
    title: "Vulnerable npm:@modelcontextprotocol/inspector (2 advisories in OSV)"
    class: vulnerable-component
    refs: ["GHSA-g9hg-qhmf-q45m", "CVE-2025-58444", "GHSA-7f8r-222p-6f5g", "CVE-2025-49596"]
    action: block   # co najmniej jedno advisory HIGH/CRITICAL
    match:
      type: package-version
      names: ["@modelcontextprotocol/inspector"]
      ranges:
        - [{introduced: "0"}, {fixed: "0.16.6"}]   # GHSA-g9hg-qhmf-q45m
        - [{introduced: "0"}, {fixed: "0.14.1"}]   # GHSA-7f8r-222p-6f5g
    tests:
      positive: ["npx @modelcontextprotocol/inspector@0.0.1"]
      negative: ["npx @modelcontextprotocol/inspector@0.16.6"]
