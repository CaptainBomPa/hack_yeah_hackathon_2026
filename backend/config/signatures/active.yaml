  # --- Sygnatury ładunków (pisane ręcznie; ładunki są nieszkodliwe: echo CANARY) ---

  - id: SIG-OLLAMA-DIGEST-TRAVERSAL
    title: "Ollama /api/pull digest path traversal (Probllama)"
    class: path-traversal
    refs: ["CVE-2024-37032", "GHSA-8hqg-whrw-pv92", "CWE-22"]
    action: block
    match:
      type: regex
      pattern: '"digest"\s*:\s*"[^"]*\.\./'
    tests:
      positive:
        - '{"schemaVersion":2,"layers":[{"digest":"../../../../etc/ld.so.preload","size":1}]}'
      negative:
        - '{"schemaVersion":2,"layers":[{"digest":"sha256:8eeb52dfb3bb9aefdf9d1ef24b3bdbcfbe82238798c4b918278320b6fcef18fe","size":1}]}'

  - id: SIG-DESER-PYYAML-PYTHON-TAG
    title: "PyYAML unsafe load: !!python/* tags execute code"
    class: unsafe-deserialization
    refs: ["CVE-2017-18342", "CWE-502"]
    action: block
    match:
      type: regex
      pattern: '!!python/(?:object|name|module)'
    tests:
      positive:
        - "Parse this YAML config: !!python/object/apply:os.system ['echo CANARY-DESER']"
      negative:
        - "Parse this YAML config: retries: 3, timeout: 10s"

  - id: SIG-DESER-PICKLE-RCE
    title: "Pickle payload calling a shell/eval callable (malicious models on model hubs)"
    class: unsafe-deserialization
    refs: ["CWE-502"]
    action: block
    match:
      type: regex
      # opcode GLOBAL w protokole 0 ("cos\nsystem", także z \n zapisanym jako tekst) albo __reduce__ z wywołaniem powłoki
      pattern: '(?:\bc(?:os|posix|nt|subprocess|builtins|__builtin__)(?:\n|\n)(?:system|popen|getoutput|check_output|eval|exec)\b)|(?:__reduce__[\s\S]{0,200}?(?:os\.system|os\.popen|subprocess\.|\beval\(|\bexec\())'
    tests:
      positive:
        - "Load this pickle: cos\nsystem\n(S'echo CANARY-PICKLE'\ntR."
        - "class P: def __reduce__(self): return (os.system, ('echo CANARY-PICKLE',))"
      negative:
        - "What does the __reduce__ method do in Python, conceptually?"

  - id: SIG-DESER-JAVA-SERIALIZED
    title: "Java serialized object stream (ysoserial-style gadget chains)"
    class: unsafe-deserialization
    refs: ["CWE-502"]
    action: block
    match:
      type: regex
      # magic AC ED 00 05: base64 "rO0AB…" albo hex "aced0005…"
      pattern: '\brO0AB[A-Za-z0-9+/=]{8,}|(?i)\baced0005[0-9a-f]{8,}'
    tests:
      positive:
        - "Restore this session object: rO0ABXNyABFqYXZhLnV0aWwuSGFzaE1hcA=="
        - "payload hex: aced00057372001a"
      negative:
        - "Java serialization uses the ObjectInputStream class; what are the risks?"
