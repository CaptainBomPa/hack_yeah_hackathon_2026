plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'pl.hackyeah'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2025.1.3')
	set('cucumberVersion', '7.20.1')
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Self-testing suite (CRITERIA: "positive and negative cases for the controls"), docs/testing/README.md.
	// Cucumber odpala się jako silnik JUnit Platform — ten sam `./gradlew test`, żadnego osobnego runnera.
	testImplementation 'org.junit.platform:junit-platform-suite'
	testImplementation platform("io.cucumber:cucumber-bom:${cucumberVersion}")
	testImplementation 'io.cucumber:cucumber-java'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine'
	testImplementation 'io.cucumber:cucumber-picocontainer'
	testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.29.1'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Gdzie adapter Allure (allure-cucumber7-jvm) zapisuje wyniki — jawnie, bez pluginu Gradle
	// `io.qameta.allure` (niekompatybilny z Gradle 9.x: https://github.com/allure-framework/allure-gradle/issues,
	// błąd `DefaultDecoratedConvention` przy tworzeniu zadania `allureReport`). Raport generuje się
	// przez standalone CLI, zob. backend/README.md "Self-testing suite".
	systemProperty 'allure.results.directory', "${layout.buildDirectory.get().asFile}/allure-results"
}

// Stawia Postgresa z docker-compose.yml i czeka, aż będzie healthy.
tasks.register('dbUp', Exec) {
	workingDir = rootProject.projectDir.parentFile
	commandLine 'docker', 'compose', 'up', '-d', '--wait', 'db'
}
