plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'pl.hackyeah'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2025.1.3')
	set('cucumberVersion', '7.20.1')
	set('testcontainersVersion', '2.0.5')
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Paczka reguł sekretów Gitleaks (TOML); wersja z jackson-bom zarządzanego przez Spring Boot.
	implementation 'tools.jackson.dataformat:jackson-dataformat-toml'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Self-testing suite (CRITERIA: "positive and negative cases for the controls"), docs/testing/README.md.
	// Cucumber odpala się jako silnik JUnit Platform — ten sam `./gradlew test`, żadnego osobnego runnera.
	testImplementation 'org.junit.platform:junit-platform-suite'
	testImplementation platform("io.cucumber:cucumber-bom:${cucumberVersion}")
	testImplementation 'io.cucumber:cucumber-java'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine'
	testImplementation 'io.cucumber:cucumber-picocontainer'
	testImplementation 'io.qameta.allure:allure-cucumber7-jvm:2.29.1'

	// Auto-starts/stops the real semantic-sidecar (Docker Compose) for semantic_sidecar_e2e.feature
	// — only when enabled, see SemanticSidecarE2ESteps.java and the testWithSidecar task below.
	testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
	testImplementation 'org.testcontainers:testcontainers'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Gdzie adapter Allure (allure-cucumber7-jvm) zapisuje wyniki — jawnie, bez pluginu Gradle
	// `io.qameta.allure` (niekompatybilny z Gradle 9.x: https://github.com/allure-framework/allure-gradle/issues,
	// błąd `DefaultDecoratedConvention` przy tworzeniu zadania `allureReport`). Raport generuje się
	// przez standalone CLI, zob. backend/README.md "Self-testing suite".
	systemProperty 'allure.results.directory', "${layout.buildDirectory.get().asFile}/allure-results"
}

// Threat feed (docs/redteam-feed.md): OSV → triage → proponowany feed sygnatur + raport w
// ../tests/redteam/proposals/<data>/. Offline (snapshot): ./gradlew threatFeed --args="--offline"
tasks.register('threatFeed', JavaExec) {
	group = 'threat feed'
	description = 'Fetches OSV advisories for the watchlist and writes a proposed signature feed + report.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'pl.hackyeah.controllayer.threatfeed.ThreatFeedTool'
	workingDir = projectDir
}

// Regresja feedu sygnatur: każda sygnatura z config/signatures/active.yaml musi łapać swoje
// przypadki pozytywne, przepuszczać negatywne i nie trafiać w korpus benign.
tasks.register('signatureRegression', Test) {
	group = 'threat feed'
	description = 'Runs the signature feed regression (config/signatures/active.yaml).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'pl.hackyeah.controllayer.guard.signature.SignatureFeedRegressionTest'
	}
	// -Pfeed=<plik> sprawdza inny feed, np. propozycję z threatFeed przed przeniesieniem do active.yaml.
	def feed = findProperty('feed') ?: 'config/signatures/active.yaml'
	systemProperty 'signatureFeed', feed
	// Feed to plik poza classpath — bez tego Gradle uznałby test za "up-to-date" po edycji feedu.
	inputs.file(feed)
	inputs.dir('config/signatures')
	testLogging {
		events 'passed', 'failed'
	}
}

// Stawia Postgresa z docker-compose.yml i czeka, aż będzie healthy.
tasks.register('dbUp', Exec) {
	workingDir = rootProject.projectDir.parentFile
	commandLine 'docker', 'compose', 'up', '-d', '--wait', 'db'
}

// Cała suita, ale semantic_sidecar_e2e.feature sam stawia (Testcontainers) i gasi prawdziwego
// semantic-sidecara z docker-compose.yml zamiast go pomijać — zob. SemanticSidecarE2ESteps.java.
// Wymaga Dockera; pierwsze uruchomienie ściąga ~600MB modelu z Hugging Face.
tasks.register('testWithSidecar', Test) {
	group = 'verification'
	description = 'Full suite with the real semantic-sidecar auto-started/stopped via Testcontainers (needs Docker).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	systemProperty 'allure.results.directory', "${layout.buildDirectory.get().asFile}/allure-results"
	systemProperty 'sidecarE2E', 'true'
	systemProperty 'compose.file', rootProject.projectDir.parentFile.toPath().resolve('docker-compose.yml').toString()
	// Without this, the sidecar's image build / model download (several minutes, first run) prints
	// nothing at all to the console — indistinguishable from a hang. Testcontainers' own log
	// consumer in SemanticSidecarE2ESteps prints straight to System.out specifically so this makes
	// it visible instead of only landing in the (unread, until the task finishes) test report.
	testLogging {
		showStandardStreams = true
	}
}
