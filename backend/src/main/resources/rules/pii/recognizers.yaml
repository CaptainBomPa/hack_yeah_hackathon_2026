# Paczka recognizerów PII dla guarda PII-RECOGNIZERS (docs/deterministic/pii-recognizers.md).
#
# Format: YAML recognizerów Presidio (`recognizers:`, `name`, `supported_entity`,
# `patterns[name, regex, score]`, `context`, `deny_list`), więc recognizery wzorcowe z Presidio
# można tu przenosić niemal 1:1. Rozszerzenia AI Control Layer:
#   id               – polityka widoczna w trace (case file docs/deterministic/01-pii-detection.md §11)
#   validator        – nazwa walidatora z Validators.java (pesel, nip, regon, pl_id_card, luhn, iban, email)
#   require_context  – bez słowa kontekstowego w oknie trafienie jest odrzucane
#   allow_list       – wartości ignorowane (porównanie po zdjęciu separatorów)
#   action           – redact | block | monitor (domyślnie redact)
#   operator         – operator anonymizera Presidio: replace (new_value) | mask | redact
#
# Scoring jak w Presidio: walidator OK → 1.0, walidator NIE → odrzuć, słowo z `context` w oknie
# → min(1, max(score + 0.35, 0.4)). Próg `threshold` jest w application.yml.
# Regexy to java.util.regex; w YAML trzymaj je w apostrofach, żeby `\d` nie wymagało escapowania.
# Słowa kontekstowe: pojedyncze słowa, porównywane prefiksowo bez diakrytyków ("dowod" ~ "dowodu").
#
# Wzorce, score i słowa kontekstowe oznaczone "Presidio:" pochodzą z predefiniowanych recognizerów
# Microsoft Presidio (MIT, Copyright (c) Presidio Contributors; pełna licencja: PRESIDIO-LICENSE).

recognizers:
  - id: PII-001
    name: Polish PESEL
    supported_entity: PL_PESEL
    supported_language: pl
    # Presidio: PlPeselRecognizer (score 0.4, context "pesel", checksum). Walidator dodatkowo
    # sprawdza datę urodzenia; granice cyfr zamiast gołego wzorca.
    patterns:
      - name: PESEL
        regex: '(?<!\d)\d{11}(?!\d)'
        score: 0.4
    validator: pesel
    context: [pesel]

  - id: PII-002
    name: Polish NIP
    supported_entity: PL_NIP
    supported_language: pl
    patterns:
      - name: NIP (3-3-2-2)
        regex: '(?<![\w-])(?:PL ?)?\d{3}-?\d{3}-?\d{2}-?\d{2}(?![\w-])'
        score: 0.3
      - name: NIP (3-2-2-3)
        regex: '(?<![\w-])(?:PL ?)?\d{3}-\d{2}-\d{2}-\d{3}(?![\w-])'
        score: 0.3
    validator: nip
    context: [nip, vat, podatk]

  - id: PII-003
    name: Polish REGON
    supported_entity: PL_REGON
    supported_language: pl
    # 9 cyfr koliduje z telefonem, więc bez słowa "REGON" nie zgłaszamy.
    patterns:
      - name: REGON 9/14
        regex: '(?<!\d)\d{9}(?:\d{5})?(?!\d)'
        score: 0.3
    validator: regon
    require_context: true
    context: [regon]

  - id: PII-004
    name: Polish identity card
    supported_entity: PL_ID_CARD
    supported_language: pl
    # Format AAA999999 pasuje też do SKU i numerów faktur: checksum + kontekst.
    patterns:
      - name: ID card
        regex: '(?<![A-Za-z0-9])[A-Z]{3} ?\d{6}(?![A-Za-z0-9])'
        score: 0.3
    validator: pl_id_card
    require_context: true
    context: [dowod, dowodu, seria, dokument, identity]

  - id: PII-005
    name: E-mail address
    supported_entity: EMAIL_ADDRESS
    # Presidio: EmailRecognizer (score 0.5, context "email", walidacja domeny). Regex uproszczony
    # i z ograniczonymi powtórzeniami (ReDoS).
    patterns:
      - name: Email (Medium)
        regex: '(?<![\w.%+-])[\w.%+-]{1,64}@[\w-]{1,63}(?:\.[\w-]{1,63}){1,8}'
        score: 0.5
    validator: email
    context: [email, mail, poczta, adres]

  - id: PII-006
    name: Polish phone number
    supported_entity: PHONE_NUMBER
    # Bez libphonenumber: numer z +48/0048 przechodzi próg sam, goły 9-cyfrowy tylko z kontekstem.
    patterns:
      - name: Phone PL (international)
        regex: '(?<![\w+])(?:\+|00)48[ -]?\d{3}[ -]?\d{3}[ -]?\d{3}(?!\d)'
        score: 0.5
      - name: Phone PL (national, grouped)
        regex: '(?<![\w+-])\d{3}[ -]\d{3}[ -]\d{3}(?![\w-])'
        score: 0.3
      - name: Phone PL (national, plain)
        regex: '(?<![\w+])\d{9}(?!\d)'
        score: 0.2
    context: [tel, telefon, phone, komork, kom, zadzwon, sms, mobile]

  - id: PII-007
    name: Payment card number
    supported_entity: CREDIT_CARD
    # Presidio: CreditCardRecognizer (regex, score 0.3, context, Luhn) — regex 1:1.
    patterns:
      - name: All Credit Cards (weak)
        regex: '\b(?!1\d{12}(?!\d))((4\d{3})|(5[0-5]\d{2})|(6\d{3})|(1\d{3})|(3\d{3}))[- ]?(\d{3,4})[- ]?(\d{3,4})[- ]?(\d{3,5})\b'
        score: 0.3
    validator: luhn
    context: [credit, card, karta, karty, visa, mastercard, amex, discover, jcb, diners, maestro, cvv, cvc]

  - id: PII-008
    name: IBAN / Polish NRB
    supported_entity: IBAN_CODE
    # Presidio: IbanRecognizer ("IBAN Generic", score 0.5, context, mod-97); NRB = polski rachunek bez "PL".
    patterns:
      - name: IBAN Generic
        regex: '(?<![A-Z0-9])([A-Z]{2}[0-9]{2}(?:[ -]?[A-Z0-9]{4}){2,6})((?:[ -]?[A-Z0-9]{4})?)((?:[ -]?[A-Z0-9]{1,3})?)(?![A-Z0-9])'
        score: 0.5
      - name: NRB
        regex: '(?<![\w-])\d{2}(?: ?\d{4}){6}(?![\w-])'
        score: 0.4
    validator: iban
    context: [iban, bank, konto, konta, rachun, nrb, przelew, account, transaction]
