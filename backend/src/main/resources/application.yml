# Konfiguracja wspólna dla wszystkich profili.
# Profile: `local` (H2 in-memory, schemat z Hibernate) i `prod` (PostgreSQL, schemat z Flyway).
# Bez jawnie ustawionego profilu startuje `local`.

server:
  port: 8000

spring:
  application:
    name: control-layer
  profiles:
    default: local
  config:
    import:
      # Polityka uprawnień (role -> dostęp do modeli). Plik opcjonalny: brak = odmowa dla wszystkich.
      - optional:file:${CONTROL_LAYER_POLICY_FILE:config/policy.yaml}
      # Konta startowe (demo). Używane tylko, gdy control-layer.seed.enabled=true.
      - optional:file:config/users.yaml
  jpa:
    open-in-view: false

# Katalog modeli = allowlista z VISION.md §4 ("allowlista modeli"). `tag` to dokładna nazwa,
# jaką wysyła klient w polu `model` POST /v1/chat/completions — bez warstwy aliasów (ustalone
# świadomie, zgodnie z tym, co już zakłada frontend). Model spoza tej listy albo z enabled:false
# jest odrzucany identycznie jak nieznany. Docelowo może przenieść się do policy.yaml razem
# z resztą polityk (VISION.md §9, krok 1) — dziś żyje tu, żeby nie czekać na ten format.
control-layer:
  model-timeout: 60s
  models:
    - tag: qwen2.5:1.5b-instruct-q4_K_M
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      enabled: true
    - tag: qwen2.5:0.5b
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      enabled: true
  # Deterministyczne guardy (docs/deterministic/how-to-write-a-rule.md). Guard bez wpisu poniżej
  # jest wyłączony; klucz musi odpowiadać `Guard.id()`, inaczej aplikacja nie wystartuje.
  guards:
    enabled: true
    rules:
      # Sekrety (docs/deterministic/02-secret-detection.md): paczka reguł Gitleaks v8.30.1 (MIT) z
      # src/main/resources/rules/gitleaks/, skan Aho-Corasick + regex w oknie. Przed PII, żeby sekret
      # zawierający cyfry został zredagowany w całości. Id reguł Gitleaks rozdzielone przecinkami:
      # blockRules blokują, monitorRules tylko raportują w trace, disabledRules są pomijane.
      SEC-GITLEAKS:
        enabled: true
        order: 50
        params:
          blockRules: "private-key"
          monitorRules: ""
          disabledRules: ""
      # Silnik PII z konceptami Presidio (docs/deterministic/pii-recognizers.md). Recognizery
      # PII-001..PII-008 są danymi w `pack`; tu tylko próg i nadpisania akcji per id recognizera.
      PII-RECOGNIZERS:
        enabled: true
        order: 100
        params:
          pack: classpath:rules/pii/recognizers.yaml
          threshold: 0.5
          contextPrefixWords: 5
          contextSuffixWords: 3
          disabledRecognizers: ""
          blockRecognizers: ""     # np. "PII-007" = karta płatnicza blokuje zamiast redagować
          monitorRecognizers: ""   # tylko raport w trace, bez redakcji
      # SEM-001: kontrola semantyczna przez sidecar (semantic-sidecar/). Domyślnie WYŁĄCZONA, bo bez sidecara
      # (fail-closed) blokowałaby każde żądanie. W docker-compose.yml włącza ją SEMANTIC_GUARD_ENABLED=true.
      # blockThreshold: skalibrowany wynik 0-1 detektora Horizon (sidecar), dobrany z docelowego odsetka fałszywych alarmów
      # (nie "0.5"): 0.9 daje ok. 1% FPR na NotInject i ok. 85% recallu na naszych atakach. Zob. semantic-sidecar/docs/models.md.
      # UWAGA: próg zależy od modelu i jego kalibracji (config/calibration/); po zmianie modelu trzeba go wyznaczyć od nowa.
      # failureMode: closed (awaria/brak wyniku = blokada) albo open.
      SEM-001: { enabled: "${SEMANTIC_GUARD_ENABLED:false}", order: 200, params: { blockThreshold: 0.9, timeoutMs: 4000, failureMode: closed } }
  sidecar:
    # Sidecar semantyczny (Python/FastAPI, semantic-sidecar/), używany przez guard SEM-001 powyżej.
    base-url: ${SIDECAR_BASE_URL:http://localhost:8001}

management:
  endpoints:
    web:
      exposure:
        include: health,info
